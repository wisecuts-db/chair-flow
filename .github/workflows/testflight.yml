name: TestFlight

# Builds the iPhone app on Expo's servers and (once ASC app id is set) sends it to TestFlight.
# Start it from GitHub: Actions > TestFlight > Run workflow.
#
# Repository secrets needed (Settings > Secrets and variables > Actions):
#   EXPO_TOKEN      Expo access token (expo.dev > Account settings > Access tokens)
# App Store Connect key ID Y8T5M2GZTW and issuer ID are set below (not secret).
#   ASC_KEY_P8      Full text of the AuthKey_XXXX.p8 file, including the BEGIN/END lines
# Apple Team ID Q2DCVH33V7 is set below (not secret).

on:
  workflow_dispatch:
    inputs:
      build:
        description: Make a new build (off = resend the latest build)
        type: boolean
        default: true
      submit:
        description: Send the build to TestFlight (needs ascAppId in mobile/eas.json)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  ios:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_KEY_ID: Y8T5M2GZTW
      EXPO_ASC_ISSUER_ID: 715f6cd9-abee-4a0a-a03a-c969bcb00ab8
      EXPO_APPLE_TEAM_ID: Q2DCVH33V7
      EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/asc_key.p8
      ASC_API_KEY_PATH: ${{ github.workspace }}/asc_key.p8
      ASC_API_KEY_ID: Y8T5M2GZTW
      ASC_API_KEY_ISSUER_ID: 715f6cd9-abee-4a0a-a03a-c969bcb00ab8
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets are set
        env:
          HAS_P8: ${{ secrets.ASC_KEY_P8 != '' }}
        run: |
          missing=""
          [ -n "$EXPO_TOKEN" ] || missing="$missing EXPO_TOKEN"
          [ -n "$EXPO_ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$EXPO_ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ "$HAS_P8" = "true" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Write App Store Connect key
        env:
          KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # Rebuild a clean PEM even if the pasted key lost its line breaks or headers.
          python3 - <<'PY'
          import os, re, textwrap
          raw = os.environ['KEY']
          body = re.sub(r'-----(BEGIN|END)[A-Z ]*-----', '', raw)
          body = re.sub(r'[^A-Za-z0-9+/=]', '', body)
          # Keep only the key itself: an Apple .p8 key always starts "MIG?AgEAMBMGByqGSM49AgEG".
          m = re.search(r'MIG.AgEAMBMGByqGSM49AgEG', body)
          if not m:
              raise SystemExit('ASC_KEY_P8 does not look like an App Store Connect .p8 key. Paste the whole file text again.')
          import base64
          head = base64.b64decode(body[m.start():m.start() + 4])
          total = head[2] + 3                      # DER: 30 81 <len>
          need = -(-total // 3) * 4                # base64 length incl. padding
          extra = len(body) - need
          body = body[m.start():m.start() + need]
          if len(body) < need:
              raise SystemExit('ASC_KEY_P8 is cut off. Paste the whole .p8 file text again.')
          if extra:
              print('Note: ignored %d stray characters around the pasted key' % extra)
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(textwrap.wrap(body, 64)) + '\n-----END PRIVATE KEY-----\n'
          open(os.environ['EXPO_ASC_API_KEY_PATH'], 'w').write(pem)
          print('App Store Connect key written (%d base64 chars)' % len(body))
          PY
          # Pass trimmed IDs to later steps (EAS reads these too).
          echo "EXPO_ASC_KEY_ID=$(printf '%s' "$EXPO_ASC_KEY_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "ASC_API_KEY_ID=$(printf '%s' "$EXPO_ASC_KEY_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "EXPO_ASC_ISSUER_ID=$(printf '%s' "$EXPO_ASC_ISSUER_ID" | tr -d '[:space:]' | tr 'A-F' 'a-f')" >> "$GITHUB_ENV"
          echo "ASC_API_KEY_ISSUER_ID=$(printf '%s' "$EXPO_ASC_ISSUER_ID" | tr -d '[:space:]' | tr 'A-F' 'a-f')" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm install --no-audit --no-fund

      - name: Link Expo project
        run: eas init --non-interactive --force

      - name: Apple signing certificate and profile
        if: ${{ inputs.build }}
        id: creds
        env:
          ASC_KEY_PATH: ${{ github.workspace }}/asc_key.p8
          ASC_KEY_ID: Y8T5M2GZTW
          ASC_ISSUER_ID: 715f6cd9-abee-4a0a-a03a-c969bcb00ab8
          BUNDLE_ID: Com.chairflow123.app
        run: |
          set -o pipefail
          pip install --quiet cryptography requests
          python3 scripts/ios_credentials.py | tee /tmp/creds.log
          echo "changed=$(tail -1 /tmp/creds.log)" >> "$GITHUB_OUTPUT"

      - name: Save Expo link and encrypted certificate to the repo
        run: |
          git config user.name "Chair Flow CI"
          git config user.email "ci@users.noreply.github.com"
          git add credentials app.json
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "CI: save Expo project link and encrypted iOS signing files [skip ci]"
          git push

      - name: Build iOS on Expo
        if: ${{ inputs.build }}
        run: eas build --platform ios --profile production --non-interactive --wait

      - name: Show Expo build log (on failure)
        if: failure()
        run: pip install --quiet brotli && python3 scripts/expo_build_log.py || true

      - name: Send to TestFlight
        if: ${{ inputs.submit }}
        run: |
          if ! grep -q '"ascAppId"' eas.json; then
            echo "::warning::Build finished. Not sent to TestFlight yet: create the app in App Store Connect and add its Apple ID as ascAppId in mobile/eas.json."
            exit 0
          fi
          eas submit --platform ios --profile production --latest --non-interactive --wait --verbose-fastlane
